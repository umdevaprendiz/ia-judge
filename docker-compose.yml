# Nome do projeto no Docker (imagens e nomes do Docker só aceitam minúsculas).
name: sergius-ia-judge

# As senhas do MySQL local vêm do arquivo .env (fora do git). Crie-o uma vez com:
#   python scripts/preparar_ambiente.py

x-banco-local: &banco-local
  DATABASE_URL: mysql+pymysql://sergius:${MYSQL_SENHA_APP:?rode python scripts/preparar_ambiente.py}@mysql:3306/sergius

services:
  # MySQL local para desenvolvimento e testes (em produção, o banco é o MySQL da Aiven)
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_SENHA_ROOT:?rode python scripts/preparar_ambiente.py}
      MYSQL_DATABASE: sergius
      MYSQL_USER: sergius
      MYSQL_PASSWORD: ${MYSQL_SENHA_APP:?rode python scripts/preparar_ambiente.py}
    ports:
      - "127.0.0.1:${MYSQL_PORTA_LOCAL:-33307}:3306"
    volumes:
      - dados-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u sergius -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  # API para os estudantes. Documentação interativa em http://localhost:8000/docs
  #   docker compose up api
  api:
    build:
      context: .
      target: api
    image: sergius-ia-judge:api
    environment: *banco-local
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Roda o notebook de testes contra o código atual da pasta (montado só para leitura).
  #   docker compose run --rm testes
  testes:
    build:
      context: .
      target: dev
    image: sergius-ia-judge:dev
    environment:
      <<: *banco-local
      # no GitHub Actions, a parte dos testes que usa o banco é obrigatória
      CI: ${CI:-false}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./:/app:ro

  # JupyterLab para editar e rodar os testes, com a pasta do projeto montada.
  #   docker compose up jupyter
  # O Jupyter gera um token aleatório a cada início e mostra no terminal o endereço
  # completo (http://127.0.0.1:8888/lab?token=...). Não fixe um token aqui: este
  # arquivo vai para o repositório público.
  jupyter:
    build:
      context: .
      target: dev
    image: sergius-ia-judge:dev
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser"]
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./:/app

volumes:
  dados-mysql:
