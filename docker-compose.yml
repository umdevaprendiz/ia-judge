# Nome do projeto no Docker (imagens e nomes do Docker só aceitam minúsculas).
name: sergius-ia-judge

services:
  # API para os estudantes. Documentação interativa em http://localhost:8000/docs
  #   docker compose up api
  api:
    build:
      context: .
      target: api
    image: sergius-ia-judge:api
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Roda o notebook de testes contra o código atual da pasta (montado só para leitura).
  #   docker compose run --rm testes
  testes:
    build:
      context: .
      target: dev
    image: sergius-ia-judge:dev
    volumes:
      - ./:/app:ro

  # JupyterLab para editar e rodar os testes, com a pasta do projeto montada.
  #   docker compose up jupyter   ->   http://127.0.0.1:8888/lab?token=dosimetria
  jupyter:
    build:
      context: .
      target: dev
    image: sergius-ia-judge:dev
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser"]
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-dosimetria}
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./:/app
