# Blueprint do Render: publica a API a partir deste repositório, usando o Dockerfile.
# No painel do Render: New -> Blueprint -> escolher este repositório -> Apply.
# O Render compila o último estágio do Dockerfile, que é o alvo "api".
services:
  - type: web
    name: sergius-ia-judge
    runtime: docker
    plan: free
    region: virginia            # a região disponível mais próxima do Brasil
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /saude
    # quem publica é o GitHub Actions (.github/workflows/testes.yml), depois dos
    # testes, chamando o deploy hook do Render; o Render não publica sozinho
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8000"
      # atrás do proxy do Render: HTTPS original informado pelo X-Forwarded-Proto
      - key: CONFIAR_PROXY
        value: "1"
      # o Render fica atrás do Cloudflare, que preenche (e sobrescreve) o IP real do visitante
      # neste cabeçalho; o X-Forwarded-For não serve (o último valor é o IP do Cloudflare)
      - key: IP_CLIENTE_CABECALHO
        value: cf-connecting-ip
      # segredos: definidos só no painel do Render (Environment), nunca aqui
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_CA_CERT
        sync: false
      # usuário que cria e altera tabelas, só para as migrações (o site usa DATABASE_URL)
      - key: DATABASE_URL_MIGRACAO
        sync: false
